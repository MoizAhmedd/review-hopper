<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Review Hopper</title>
    <style>
      :root { color-scheme: light dark; }
      body { font: 13px/1.5 system-ui, sans-serif; margin: 0; padding: 14px 16px; width: 260px; }
      h1 { font-size: 15px; margin: 0 0 10px; }
      h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; opacity: .65; margin: 14px 0 6px; font-weight: 600; }
      label { display: flex; gap: 8px; align-items: center; padding: 3px 0; }
      p { margin: 12px 0 0; opacity: .65; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>Review Hopper</h1>
    <label><input type="checkbox" id="enabled" /> On for GitLab and GitHub reviews</label>
    <h2>Hide</h2>
    <label><input type="checkbox" id="tests" /> Tests</label>
    <label><input type="checkbox" id="config" /> Tool config (tsconfig, lint, jest)</label>
    <label><input type="checkbox" id="lockfile" /> Lockfiles, when package.json changed</label>
    <label><input type="checkbox" id="generated" /> Generated and vendored files</label>
    <h2>Replace</h2>
    <label><input type="checkbox" id="cards" /> Summaries for dependencies, database, Docker, CI and API files</label>
    <label><input type="checkbox" id="markdown" /> Rendered markdown</label>
    <p>Hidden files are one click away at the end of the list.</p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
